; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-super-mini]
; pioarduino: Arduino 3.x + GCC 12+/14 (C++20). Stock PlatformIO stays on GCC 8.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-super-mini
framework = arduino
build_src_filter = +<*> -<tests/> -<tools/>
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	chris--a/Keypad@^3.1.1
	fastled/FastLED@^3.10.5
build_unflags = -std=gnu++17
build_flags = 
	-std=gnu++20
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Status strip LEDs (LedManager A/B/C/D)
	-DPIN_LED_A=1
	-DPIN_LED_B=2
	-DPIN_LED_C=4
	-DPIN_LED_D=8
	; Keypad rows R4..R1 and columns L1..L4
	-DPIN_KEYPAD_ROW0=13
	-DPIN_KEYPAD_ROW1=3
	-DPIN_KEYPAD_ROW2=44
	-DPIN_KEYPAD_ROW3=43
	-DPIN_KEYPAD_COL0=9
	-DPIN_KEYPAD_COL1=10
	-DPIN_KEYPAD_COL2=11
	-DPIN_KEYPAD_COL3=12
	; NeoPixel data
	-DPIN_NEOPIXEL=48
	; I2S: bclk, ws, dout
	-DPIN_I2S_BCLK=6
	-DPIN_I2S_WS=5
	-DPIN_I2S_DOUT=7

[platformio]
src_dir = .
include_dir = .

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-super-mini]
platform = espressif32
board = esp32-s3-devkitc1-n4r2
framework = arduino
; The project root is src_dir, so explicitly exclude the native test tree and
; the tools pipeline (make_samples.cpp has its own main() for host builds).
build_src_filter = +<*> -<tests/> -<tools/>
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
	chris--a/Keypad@^3.1.1
	fastled/FastLED@^3.10.5
board_build.arduino.memory_type = qio_qspi
; max_app_4MB.csv is shipped with the core; the board json's default_4MB.csv is not.
; Factory app partition = 0x3E0000 (~3.9 MB), room for the full sample library.
board_build.partitions = max_app_4MB.csv
; Route Serial to the native USB-CDC port (the S3 Super Mini has no exposed
; UART pins; UART0 would sit on GPIO43/44, which this project uses as keypad
; rows R3/R4).
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[platformio]
src_dir = .
include_dir = .
